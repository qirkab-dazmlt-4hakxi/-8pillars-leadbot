services:
  leadbot:
    build: .
    env_file: .env
    volumes: ["./data:/app/data"]
    command: python -m leadbot.main watch
    restart: unless-stopped
  dashboard:
    build: .
    env_file: .env
    volumes: ["./data:/app/data"]
    command: uvicorn leadbot.api:app --host 0.0.0.0 --port 8080
    ports: ["8080:8080"]
    restart: unless-stopped
